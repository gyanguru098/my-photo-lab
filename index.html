
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111318">
  <title>My Photo Lab</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      color-scheme: dark;
      --bg: #101116;
      --panel: #1b1d25;
      --text: #f5f5fa;
      --muted: #a4a6b5;
      --accent: #a58bff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
    }

    main {
      width: min(100%, 620px);
      margin: auto;
      padding: 20px 16px 36px;
    }

    header { margin-bottom: 22px; }

    h1 {
      margin: 0;
      font-size: 27px;
      letter-spacing: -1px;
    }

    .sub, .hint { color: var(--muted); font-size: 13px; }

    .preview {
      display: grid;
      place-items: center;
      min-height: 240px;
      max-height: 58vh;
      overflow: hidden;
      background: #20212a;
      border: 1px solid #333541;
      border-radius: 18px;
    }

    canvas {
      display: block;
      max-width: 100%;
      max-height: 58vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    #empty {
      padding: 32px 18px;
      text-align: center;
      color: var(--muted);
    }

    .panel {
      background: var(--panel);
      border: 1px solid #30313c;
      border-radius: 18px;
      padding: 16px;
      margin-top: 14px;
    }

    .actions, .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    button, .upload {
      font: inherit;
      cursor: pointer;
      border: 1px solid #3b3d4b;
      border-radius: 12px;
      background: #292b36;
      color: var(--text);
      padding: 11px 13px;
    }

    button:active, .upload:active { opacity: .75; }

    .primary {
      background: var(--accent);
      color: #171020;
      border-color: transparent;
      font-weight: 700;
    }

    .upload {
      display: inline-block;
      text-align: center;
      flex: 1;
    }

    input[type="file"] { display: none; }

    .control { margin: 19px 0; }

    .control label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 14px;
      margin-bottom: 10px;
    }

    output { color: var(--accent); }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .presets button { flex: 1; min-width: 100px; }

    .bottom { display: flex; gap: 9px; margin-top: 14px; }
    .bottom button { flex: 1; }

    button:disabled { opacity: .4; cursor: not-allowed; }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-top: 18px;
    }
  </style>
</head>

<body>
<main>
  <header>
    <h1>My Photo Lab <span>✦</span></h1>
    <div class="sub">Your photo. Your edits. Your control.</div>
  </header>

  <section class="preview">
    <div id="empty">
      <div style="font-size:40px">▧</div>
      <strong>Start with a photo</strong>
      <p>Choose an image from your device.</p>
    </div>
    <canvas id="canvas" hidden></canvas>
  </section>

  <section class="panel">
    <div class="actions">
      <label class="upload" for="file">＋ Choose photo</label>
      <input id="file" type="file" accept="image/*">
      <button id="reset">Reset</button>
    </div>
    <p class="hint">Editing runs locally in your browser.</p>
  </section>

  <section class="panel">
    <strong>Quick looks</strong>
    <div class="presets" style="margin-top:12px">
      <button data-preset="original">Original</button>
      <button data-preset="bw">B&W</button>
      <button data-preset="cinematic">Cinematic</button>
      <button data-preset="vivid">Vivid</button>
    </div>
  </section>

  <section class="panel">
    <strong>Adjust image</strong>

    <div class="control">
      <label for="brightness">Brightness <output id="brightnessValue">100%</output></label>
      <input id="brightness" type="range" min="50" max="150" value="100">
    </div>

    <div class="control">
      <label for="contrast">Contrast <output id="contrastValue">100%</output></label>
      <input id="contrast" type="range" min="50" max="160" value="100">
    </div>

    <div class="control">
      <label for="saturation">Saturation <output id="saturationValue">100%</output></label>
      <input id="saturation" type="range" min="0" max="180" value="100">
    </div>

    <div class="control">
      <label for="warmth">Warmth <output id="warmthValue">0</output></label>
      <input id="warmth" type="range" min="0" max="100" value="0">
    </div>
  </section>

  <div class="bottom">
    <button id="download" class="primary" disabled>Download edited photo</button>
  </div>

  <footer>
    Version 1 · Basic editing works without a separate processing server.
  </footer>
</main>

<script>
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const fileInput = document.getElementById("file");
  const empty = document.getElementById("empty");
  const downloadButton = document.getElementById("download");

  const controls = {
    brightness: document.getElementById("brightness"),
    contrast: document.getElementById("contrast"),
    saturation: document.getElementById("saturation"),
    warmth: document.getElementById("warmth")
  };

  let originalImage = null;
  let isBW = false;
  let currentObjectUrl = null;

  function setDefaults() {
    controls.brightness.value = 100;
    controls.contrast.value = 100;
    controls.saturation.value = 100;
    controls.warmth.value = 0;
    isBW = false;
    updateLabels();
    render();
  }

  function updateLabels() {
    document.getElementById("brightnessValue").value =
      controls.brightness.value + "%";
    document.getElementById("contrastValue").value =
      controls.contrast.value + "%";
    document.getElementById("saturationValue").value =
      controls.saturation.value + "%";
    document.getElementById("warmthValue").value =
      controls.warmth.value;
  }

  function render() {
    if (!originalImage) return;

    const brightness = Number(controls.brightness.value);
    const contrast = Number(controls.contrast.value);
    const saturation = Number(controls.saturation.value);
    const warmth = Number(controls.warmth.value);

    canvas.width = originalImage.naturalWidth;
    canvas.height = originalImage.naturalHeight;

    ctx.filter = [
      `brightness(${brightness}%)`,
      `contrast(${contrast}%)`,
      `saturate(${isBW ? 0 : saturation}%)`,
      `sepia(${warmth}%)`
    ].join(" ");

    ctx.drawImage(originalImage, 0, 0);
    ctx.filter = "none";
  }

  fileInput.addEventListener("change", () => {
    const file = fileInput.files?.[0];
    if (!file) return;

    if (!file.type.startsWith("image/")) {
      alert("Please choose an image file.");
      return;
    }

    if (file.size > 20 * 1024 * 1024) {
      alert("Please choose an image smaller than 20 MB.");
      return;
    }

    if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
    currentObjectUrl = URL.createObjectURL(file);

    const img = new Image();
    img.onload = () => {
      originalImage = img;
      canvas.hidden = false;
      empty.hidden = true;
      downloadButton.disabled = false;
      setDefaults();
    };
    img.onerror = () => alert("Couldn't open that image.");
    img.src = currentObjectUrl;
  });

  Object.values(controls).forEach(input => {
    input.addEventListener("input", () => {
      updateLabels();
      render();
    });
  });

  document.querySelectorAll("[data-preset]").forEach(button => {
    button.addEventListener("click", () => {
      setDefaults();

      switch (button.dataset.preset) {
        case "bw":
          isBW = true;
          break;
        case "cinematic":
          controls.brightness.value = 96;
          controls.contrast.value = 125;
          controls.saturation.value = 115;
          controls.warmth.value = 12;
          break;
        case "vivid":
          controls.contrast.value = 112;
          controls.saturation.value = 150;
          break;
      }

      updateLabels();
      render();
    });
  });

  document.getElementById("reset").addEventListener("click", setDefaults);

  downloadButton.addEventListener("click", () => {
    if (!originalImage) return;

    canvas.toBlob(blob => {
      if (!blob) {
        alert("Couldn't export this photo.");
        return;
      }

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "my-photo-lab.png";
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }, "image/png");
  });
</script>
</body>
</html>
